<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskVault Admin</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="login-view" class="view">
  <div class="card login-card">
    <h1>🔐 TaskVault</h1>
    <p class="subtitle">Admin Dashboard</p>
    <form id="login-form">
      <label>Username</label>
      <input type="text" id="login-username" required autocomplete="username" />
      <label>Password</label>
      <input type="password" id="login-password" required autocomplete="current-password" />
      <button type="submit">Log in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>
</div>

<div id="app-view" class="view hidden">
  <header>
    <h1>🔐 TaskVault</h1>
    <nav>
      <button data-tab="tasks" class="tab-btn active">Tasks</button>
      <button data-tab="keys" class="tab-btn">API Keys</button>
    </nav>
    <button id="logout-btn" class="secondary">Log out</button>
  </header>

  <main>
    <section id="tasks-tab" class="tab-panel">
      <div class="panel-header">
        <h2>Tasks</h2>
        <button id="new-task-btn">+ New Task</button>
      </div>
      <table>
        <thead>
          <tr><th>Title</th><th>Status</th><th>Priority</th><th>Updated</th><th></th></tr>
        </thead>
        <tbody id="tasks-body"></tbody>
      </table>
    </section>

    <section id="keys-tab" class="tab-panel hidden">
      <div class="panel-header">
        <h2>API Keys</h2>
        <button id="new-key-btn">+ Generate Key</button>
      </div>
      <p class="hint">These keys let outside services call <code>/api/v1/tasks</code> securely without a login session.</p>
      <table>
        <thead>
          <tr><th>Label</th><th>Scope</th><th>Created</th><th>Last used</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="keys-body"></tbody>
      </table>
    </section>
  </main>
</div>

<div id="task-modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="task-modal-title">New Task</h3>
    <form id="task-form">
      <input type="hidden" id="task-id" />
      <label>Title</label>
      <input type="text" id="task-title" required maxlength="200" />
      <label>Description</label>
      <textarea id="task-description" maxlength="2000"></textarea>
      <label>Status</label>
      <select id="task-status">
        <option value="pending">Pending</option>
        <option value="in_progress">In progress</option>
        <option value="done">Done</option>
      </select>
      <label>Priority</label>
      <select id="task-priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <div class="modal-actions">
        <button type="button" class="secondary" id="task-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="key-modal" class="modal hidden">
  <div class="modal-card">
    <h3>Generate API Key</h3>
    <form id="key-form">
      <label>Label (e.g. "Partner App")</label>
      <input type="text" id="key-label" required maxlength="100" />
      <label>Scope</label>
      <select id="key-scope">
        <option value="read">Read only</option>
        <option value="write">Read + write</option>
      </select>
      <div class="modal-actions">
        <button type="button" class="secondary" id="key-cancel">Cancel</button>
        <button type="submit">Generate</button>
      </div>
    </form>
  </div>
</div>

<div id="key-reveal-modal" class="modal hidden">
  <div class="modal-card">
    <h3>Your new API key</h3>
    <p class="hint">Copy this now — it will not be shown again.</p>
    <code id="key-reveal-value" class="key-reveal"></code>
    <div class="modal-actions">
      <button type="button" id="key-reveal-close">Done</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
